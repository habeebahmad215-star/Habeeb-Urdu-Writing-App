name: Build Habeeb Urdu Writing App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find project ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*HabeebUrduWritingApp*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: HabeebUrduWritingApp ZIP file was not found."
            echo "Files available:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.zip.outputs.ZIP_FILE }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Show generated APK files
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Habeeb-Urdu-Writing-App-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
