name: Build Habeeb Urdu Writing App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

          echo "Using ZIP:"
          echo "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "${{ steps.zip.outputs.ZIP_FILE }}" \
            -d extracted

          echo "Project extracted successfully."

          find extracted \
            -maxdepth 3 \
            -type f \
            | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Show Gradle files
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Show generated APK
        if: always()
        shell: bash
        run: |
          echo "Searching for APK files..."

          find extracted \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Habeeb-Urdu-Writing-App-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Reports
          path: |
            extracted/**/build/reports/**
            extracted/**/app/build/reports/**
          if-no-files-found: ignore
