name: Build Habeeb Urdu Writing App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q "HabeebUrduWritingApp_BUILD_FIXED.zip" -d project
          echo "Project extracted successfully"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file was not found inside the ZIP."
            echo "Contents of extracted project:"
            find project -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/HabeebUrduWritingApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabeebUrduWritingApp-APK
          path: apk-output/HabeebUrduWritingApp.apk
          if-no-files-found: error
